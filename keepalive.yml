name: Keep Supabase awake

# Fa una richiesta vera al database due volte a settimana (lunedì e giovedì),
# così il progetto Free non resta mai fermo per 7 giorni e non va in pausa.
on:
  schedule:
    - cron: "17 6 * * 1,4"   # 06:17 UTC; minuto "storto" per evitare l'ora di punta di GitHub
  workflow_dispatch:          # permette di lanciarlo a mano dalla scheda Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: "https://xhbmrxajmhdqvohagqvi.supabase.co"
          # Chiave "publishable": è la stessa già visibile in index.html, non è un segreto.
          SUPABASE_KEY: "sb_publishable_y2BwF8yqUycxxB2B4GsyuA_pTPpwwYs"
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 15 --retry-all-errors \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/cene?select=id&limit=1" \
            -o /dev/null -w "HTTP %{http_code}\n"
